services:
  mysql:
    image: mysql:8.4
    container_name: my-ant-design-pro-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my_ant_design_pro
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --max-connections=50
      - --table-open-cache=200
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -proot_password
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
